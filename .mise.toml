[tools]
go = "1.26.3"

[tasks.fmt]
description = "Format Go files"
run = "gofmt -w ."

[tasks.lint]
description = "Run Go vet"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.build]
description = "Build the listener binary"
run = "go build -o bin/meshcom-listener ./cmd/meshcom-listener"

[tasks.ci]
description = "Run the full local CI suite"
depends = ["lint", "test", "build"]

[tasks.docker-build]
description = "Build the Docker image"
run = "docker build -t meshcom-listener:local ."
