services:
  listener:
    build: .
    container_name: meshcom-listener
    restart: unless-stopped
    ports:
      - "1799:1799/udp"
    env_file: .env
    volumes:
      - ./data:/data
    depends_on:
      - apprise

  apprise:
    image: caronc/apprise
    container_name: meshcom-apprise
    restart: unless-stopped
