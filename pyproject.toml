[project]
name = "meshcom-listener"
version = "0.2.0"
description = "High-performance UDP listener for MeshCom nodes with SurrealDB and Apprise"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.1",
    "environs>=14.1.1",
    "surrealdb>=0.3.3",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
]

[project.scripts]
meshcom = "main:app"

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
